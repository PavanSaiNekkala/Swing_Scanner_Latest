name: Swing Scanner - All Segments


on:

  workflow_dispatch:

    inputs:

      segment:

        description: "Select segment to scan"

        required: true

        default: "ALL"

        type: choice

        options:
          - ALL
          - LargeCap
          - MidCap
          - SmallCap
          - Nifty500


  schedule:

    # Daily at 4:00 PM IST
    # GitHub Actions cron uses UTC.
    # 4:00 PM IST = 10:30 AM UTC.

    - cron: "30 10 * * *"


permissions:

  contents: write


concurrency:

  group: swing-scanner-workflow

  cancel-in-progress: false


jobs:

  scan:

    name: Scan - ${{ matrix.segment }}

    runs-on: ubuntu-latest

    timeout-minutes: 60


    strategy:

      fail-fast: false

      # Run one segment at a time so Git commits
      # do not conflict when history workbooks are updated.
      max-parallel: 1

      matrix:

        segment:
          - LargeCap
          - MidCap
          - SmallCap
          - Nifty500


    steps:

      # --------------------------------------------------
      # CHECKOUT MAIN BRANCH
      # --------------------------------------------------

      - name: Checkout main branch

        uses: actions/checkout@v4

        with:

          ref: main

          fetch-depth: 0


      # --------------------------------------------------
      # CHECK WHETHER MATRIX SEGMENT SHOULD RUN
      # --------------------------------------------------

      - name: Check selected segment

        id: selection

        shell: bash

        run: |

          # Scheduled workflow:
          # Always run all segments.

          if [ "${{ github.event_name }}" = "schedule" ]; then

            echo "run_segment=true" >> "$GITHUB_OUTPUT"

            exit 0

          fi


          # Manual workflow:
          # Run ALL or only the selected segment.

          SELECTED_SEGMENT="${{ inputs.segment }}"


          if [ "$SELECTED_SEGMENT" = "ALL" ] || \
             [ "$SELECTED_SEGMENT" = "${{ matrix.segment }}" ]; then

            echo "run_segment=true" >> "$GITHUB_OUTPUT"

          else

            echo "run_segment=false" >> "$GITHUB_OUTPUT"

          fi


      # --------------------------------------------------
      # SET UP PYTHON
      # --------------------------------------------------

      - name: Set up Python

        if: steps.selection.outputs.run_segment == 'true'

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # --------------------------------------------------
      # CACHE PIP DEPENDENCIES
      # --------------------------------------------------

      - name: Cache Python dependencies

        if: steps.selection.outputs.run_segment == 'true'

        uses: actions/cache@v4

        with:

          path: ~/.cache/pip

          key: >-
            ${{ runner.os }}-python-3.12-
            ${{ hashFiles('requirements.txt') }}

          restore-keys: |
            ${{ runner.os }}-python-3.12-


      # --------------------------------------------------
      # INSTALL PROJECT DEPENDENCIES
      # --------------------------------------------------

      - name: Install dependencies

        if: steps.selection.outputs.run_segment == 'true'

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # --------------------------------------------------
      # INSTALL PLAYWRIGHT CHROMIUM
      # --------------------------------------------------

      - name: Install Playwright Chromium

        if: steps.selection.outputs.run_segment == 'true'

        run: |

          python -m playwright install --with-deps chromium


      # --------------------------------------------------
      # CREATE REQUIRED DIRECTORIES
      # --------------------------------------------------

      - name: Create workflow directories

        if: steps.selection.outputs.run_segment == 'true'

        run: |

          mkdir -p downloads/history

          mkdir -p downloads/_temporary

          mkdir -p workflow_debug


      # --------------------------------------------------
      # RUN SWING SCANNER
      #
      # Stock limit is automatically set to the maximum
      # available for the selected segment by Python.
      # --------------------------------------------------

      - name: Run Swing Scanner

        if: steps.selection.outputs.run_segment == 'true'

        env:

          PYTHONUNBUFFERED: "1"

        run: |

          python scan_workflow_monitor.py \
            --segment "${{ matrix.segment }}"


      # --------------------------------------------------
      # CHECK EXCEL RESULTS
      # --------------------------------------------------

      - name: Verify Excel history workbook

        if: success() && steps.selection.outputs.run_segment == 'true'

        shell: bash

        run: |

          echo "History workbooks created:"

          ls -lah downloads/history/

          WORKBOOK_COUNT="$(find downloads/history \
            -maxdepth 1 \
            -type f \
            -name '*.xlsx' \
            | wc -l)"


          if [ "$WORKBOOK_COUNT" -eq 0 ]; then

            echo "ERROR: No Excel history workbook was created."

            exit 1

          fi


      # --------------------------------------------------
      # COMMIT SUCCESSFUL RESULTS TO MAIN
      # --------------------------------------------------

      - name: Commit Excel history to main

        if: success() && steps.selection.outputs.run_segment == 'true'

        shell: bash

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add downloads/history/*.xlsx


          if git diff --cached --quiet; then

            echo "No Excel history changes to commit."

            exit 0

          fi


          git commit \
            -m "chore(scanner): update ${{ matrix.segment }} history [skip ci]"


          # Ensure the local branch contains the latest
          # main branch before pushing.

          git pull \
            --rebase \
            origin main


          git push origin HEAD:main


      # --------------------------------------------------
      # UPLOAD EXCEL RESULTS AS ARTIFACT
      # --------------------------------------------------

      - name: Upload Excel history workbook

        if: always() && steps.selection.outputs.run_segment == 'true'

        uses: actions/upload-artifact@v4

        with:

          name: >-
            swing-scanner-${{ matrix.segment }}-
            ${{ github.run_number }}

          path: |
            downloads/history/*.xlsx

          if-no-files-found: warn

          retention-days: 30


      # --------------------------------------------------
      # UPLOAD DEBUG FILES ONLY ON FAILURE
      # --------------------------------------------------

      - name: Upload debug artifacts

        if: failure() && steps.selection.outputs.run_segment == 'true'

        uses: actions/upload-artifact@v4

        with:

          name: >-
            workflow-debug-${{ matrix.segment }}-
            ${{ github.run_number }}

          path: |
            workflow_debug/**
            downloads/_temporary/**

          if-no-files-found: ignore

          retention-days: 14
