name: 📈 NEWS Daily Report

on:
  workflow_dispatch:

  schedule:
    # Monday-Friday 08:00 AM IST (02:30 UTC)
    - cron: "30 2 * * 1-5"

    # Monday-Friday 04:00 PM IST (10:30 UTC)
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: news-daily-report
  cancel-in-progress: false

env:
  PROJECT_DIR: NEWS_Daily_Report
  PYTHONUNBUFFERED: "1"
  TZ: Asia/Kolkata

jobs:
  generate-report:

    name: Generate NEWS Daily Report

    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    timeout-minutes: 30

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}

    strategy:
      matrix:
        python-version:
          - "3.12"

    steps:

      #######################################################################
      # Checkout Repository
      #######################################################################

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #######################################################################
      # Setup Python
      #######################################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      #######################################################################
      # Cache Dependencies
      #######################################################################

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles(format('{0}/requirements.txt', env.PROJECT_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-pip-

      #######################################################################
      # Install Dependencies
      #######################################################################

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      #######################################################################
      # Show Repository Structure (Debug)
      #######################################################################

      - name: Show Repository Structure
        working-directory: .
        run: |
          pwd
          echo "Repository Root:"
          ls -la
          echo ""
          echo "Directory Tree:"
          find . -maxdepth 3 -type d

      #######################################################################
      # Run Report
      #######################################################################

      - name: Generate Report
        run: |
          echo "Starting report generation..."
          python -m main
          echo "Report generation completed."

      #######################################################################
      # Verify Output
      #######################################################################

      - name: Verify Output
        run: |
          echo "Generated Files:"
          ls -R output

      #######################################################################
      # Commit Changes
      #######################################################################

      - name: Commit Generated Reports
        working-directory: .
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            $PROJECT_DIR/output/latest \
            $PROJECT_DIR/output/history

          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "chore(report): auto-update NEWS Daily Report [skip ci]"
            git push origin main
          fi

      #######################################################################
      # Upload Logs
      #######################################################################

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ${{ env.PROJECT_DIR }}/logs
          if-no-files-found: warn
          retention-days: 7

      #######################################################################
      # Upload Reports
      #######################################################################

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            ${{ env.PROJECT_DIR }}/output/latest
            ${{ env.PROJECT_DIR }}/output/history
          if-no-files-found: warn
          retention-days: 7

      #######################################################################
      # Workflow Summary
      #######################################################################

      - name: Workflow Summary
        if: always()
        run: |
          {
            echo "## 📈 NEWS Daily Report"
            echo ""
            echo "- Python Version : ${{ matrix.python-version }}"
            echo "- Branch : $GITHUB_REF_NAME"
            echo "- Commit : $GITHUB_SHA"
            echo "- Run Time : $(date)"
            echo ""
            echo "### Output Directory"
            ls -R output
          } >> "$GITHUB_STEP_SUMMARY"
