name: NSE Market Report

on:
  workflow_dispatch:

  schedule:
    # 08:30 IST
    - cron: "0 3 * * 1-5"

    # 16:00 IST
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nse-market-report
  cancel-in-progress: false

jobs:

  generate-report:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create environment file
        shell: bash
        run: |
          cat > .env <<EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
          EOF

      - name: Generate NSE market report
        run: |
          python -m main

      - name: Verify report
        shell: bash
        run: |
          test -f output/excel/NSE_Market_Report.xlsx
          ls -lh output/excel/NSE_Market_Report.xlsx

      - name: Commit updated report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/excel/NSE_Market_Report.xlsx

          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi

          git commit -m "Update NSE market report"
          git push