name: NSE Market Report

on:
  workflow_dispatch:

  schedule:
    # 08:30 IST = 03:00 UTC
    - cron: "0 3 * * 1-5"

    # 16:00 IST = 10:30 UTC
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nse-market-report
  cancel-in-progress: false

defaults:
  run:
    working-directory: NSE_MARKET_REPORT

jobs:

  generate-report:

    runs-on: ubuntu-latest

    steps:

      #########################################################################
      # CHECKOUT
      #########################################################################

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #########################################################################
      # PYTHON
      #########################################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: NSE_MARKET_REPORT/requirements.txt

      #########################################################################
      # INSTALL DEPENDENCIES
      #########################################################################

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      #########################################################################
      # ENVIRONMENT
      #########################################################################

      - name: Create environment file
        shell: bash
        run: |
          cat > .env <<EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
          EOF

      #########################################################################
      # GENERATE REPORT
      #########################################################################

      - name: Generate NSE market report
        shell: bash
        run: |
          python -m main

      #########################################################################
      # VERIFY REPORT
      #########################################################################

      - name: Verify report
        shell: bash
        run: |
          test -f output/excel/NSE_Market_Report.xlsx
          ls -lh output/excel/NSE_Market_Report.xlsx

      #########################################################################
      # COMMIT UPDATED REPORT
      #########################################################################

      - name: Commit updated report
        shell: bash
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Synchronizing with remote..."

          git fetch origin main

          git rebase origin/main

          git add output/excel/NSE_Market_Report.xlsx

          if git diff --cached --quiet; then
              echo "No report changes."
              exit 0
          fi

          git commit -m "Update NSE market report"

          for attempt in 1 2 3; do

              echo "Push attempt ${attempt}/3"

              if git push origin HEAD:main; then
                  echo "Push successful."
                  exit 0
              fi

              echo "Push failed. Rebasing..."

              git fetch origin main
              git rebase origin/main

              sleep 5

          done

          echo "Push failed after 3 attempts."

          exit 1