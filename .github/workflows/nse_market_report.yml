name: NSE Market Report

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron uses UTC.
    # These run every 30 minutes during NSE trading hours.
    #
    # 09:15 IST = 03:45 UTC
    # 15:15 IST = 09:45 UTC
    #
    # Monday-Friday.
    - cron: "45 3 * * 1-5"
    - cron: "15 4 * * 1-5"
    - cron: "45 4 * * 1-5"
    - cron: "15 5 * * 1-5"
    - cron: "45 5 * * 1-5"
    - cron: "15 6 * * 1-5"
    - cron: "45 6 * * 1-5"
    - cron: "15 7 * * 1-5"
    - cron: "45 7 * * 1-5"
    - cron: "15 8 * * 1-5"
    - cron: "45 8 * * 1-5"
    - cron: "15 9 * * 1-5"
    - cron: "45 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nse-market-report
  cancel-in-progress: false

jobs:

  generate-report:

    runs-on: ubuntu-latest

    steps:

      #########################################################################
      # CHECKOUT
      #########################################################################

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #########################################################################
      # PYTHON
      #########################################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      #########################################################################
      # INSTALL DEPENDENCIES
      #########################################################################

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      #########################################################################
      # ENVIRONMENT
      #########################################################################

      - name: Create environment file
        shell: bash
        run: |
          cat > .env <<EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
          EOF

      #########################################################################
      # RUN REPORT
      #########################################################################

      - name: Generate NSE market report
        run: |
          python -m main

      #########################################################################
      # VERIFY OUTPUT
      #########################################################################

      - name: Verify Excel report
        shell: bash
        run: |
          if [ ! -f "output/excel/NSE_Market_Report.xlsx" ]; then
            echo "ERROR: Excel report was not generated."
            exit 1
          fi

          ls -lh output/excel/NSE_Market_Report.xlsx

      #########################################################################
      # COMMIT UPDATED REPORT
      #########################################################################

      - name: Commit updated report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/excel/NSE_Market_Report.xlsx

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit \
            -m "Update NSE market report"

          git push