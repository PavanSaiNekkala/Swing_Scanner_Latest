# =============================================================================
# Pytest Configuration
# =============================================================================

[pytest]

# ---------------------------------------------------------------------------
# Test Discovery
# ---------------------------------------------------------------------------

testpaths =
    tests

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------

addopts =
    -ra
    -q
    --strict-markers
    --disable-warnings
    --tb=short
    --color=yes
    --cov=modules
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

log_cli = true

log_cli_level = INFO

log_cli_format =
    %(asctime)s | %(levelname)-8s | %(name)s | %(message)s

log_cli_date_format =
    %Y-%m-%d %H:%M:%S

# ---------------------------------------------------------------------------
# Warnings
# ---------------------------------------------------------------------------

filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning

# ---------------------------------------------------------------------------
# Custom Markers
# ---------------------------------------------------------------------------

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow-running tests