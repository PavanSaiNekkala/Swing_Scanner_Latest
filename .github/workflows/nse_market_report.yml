name: NSE Market Report

on:
  workflow_dispatch:

  schedule:
    # 08:30 IST
    - cron: "0 3 * * 1-5"

    # 16:00 IST
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nse-market-report
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: NSE_MARKET_REPORT

jobs:

  generate-report:

    runs-on: ubuntu-latest

    ##########################################################################
    # Steps
    ##########################################################################

    steps:

      ##########################################################################
      # Checkout
      ##########################################################################

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ##########################################################################
      # Python
      ##########################################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: NSE_MARKET_REPORT/requirements.txt

      ##########################################################################
      # Dependencies
      ##########################################################################

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      ##########################################################################
      # Environment
      ##########################################################################

      - name: Create .env
        run: |
          cat > .env <<EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
          EOF

      ##########################################################################
      # Generate Report
      ##########################################################################

      - name: Generate NSE Market Report
        run: |
          python -m main

      ##########################################################################
      # Verify Report
      ##########################################################################

      - name: Verify Report
        run: |
          test -f output/excel/NSE_Market_Report.xlsx
          ls -lh output/excel/NSE_Market_Report.xlsx

      ##########################################################################
      # Git Diagnostics
      ##########################################################################

      - name: Git Status
        working-directory: .
        run: |
          echo "========== GIT STATUS =========="
          git status

          echo
          echo "========== MODIFIED FILES =========="
          git diff --name-only

          echo
          echo "========== UNTRACKED FILES =========="
          git ls-files --others --exclude-standard

      ##########################################################################
      # Commit & Push
      ##########################################################################

      - name: Commit updated report
        working-directory: .
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ####################################################################
          # Stage report
          ####################################################################

          git add NSE_MARKET_REPORT/output/excel/NSE_Market_Report.xlsx

          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi

          ####################################################################
          # Save generated report
          ####################################################################

          git stash push --include-untracked

          ####################################################################
          # Sync with remote
          ####################################################################

          git fetch origin main

          git rebase origin/main

          ####################################################################
          # Restore generated report
          ####################################################################

          git stash pop || true

          ####################################################################
          # Stage again
          ####################################################################

          git add NSE_MARKET_REPORT/output/excel/NSE_Market_Report.xlsx

          ####################################################################
          # Commit
          ####################################################################

          git commit -m "Update NSE market report"

          ####################################################################
          # Push with retry
          ####################################################################

          for attempt in 1 2 3
          do

            echo "Push attempt ${attempt}/3"

            if git push origin HEAD:main
            then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed."

            git fetch origin main

            git rebase origin/main

            sleep 5

          done

          echo "Push failed after 3 attempts."

          exit 1