name: Swing Scanner - All Segments

on:
  workflow_dispatch:
    inputs:
      segment:
        description: "Select segment to scan"
        required: true
        default: "ALL"
        type: choice
        options:
          - ALL
          - LargeCap
          - MidCap
          - SmallCap
          - Nifty500

permissions:
  contents: read

concurrency:
  group: swing-scanner-workflow
  cancel-in-progress: false


jobs:

  scan:

    name: Scan - ${{ matrix.segment }}

    runs-on: ubuntu-latest

    timeout-minutes: 30

    strategy:

      fail-fast: false

      matrix:

        segment:
          - LargeCap
          - MidCap
          - SmallCap
          - Nifty500


    steps:

      # --------------------------------------------------
      # CHECKOUT REPOSITORY
      # --------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # --------------------------------------------------
      # CHECK WHETHER MATRIX SEGMENT SHOULD RUN
      # --------------------------------------------------

      - name: Check selected segment

        id: selection

        shell: bash

        run: |
          SELECTED_SEGMENT="${{ inputs.segment }}"

          if [ "$SELECTED_SEGMENT" = "ALL" ] || \
             [ "$SELECTED_SEGMENT" = "${{ matrix.segment }}" ]; then

            echo "run_segment=true" >> "$GITHUB_OUTPUT"

          else

            echo "run_segment=false" >> "$GITHUB_OUTPUT"

          fi


      # --------------------------------------------------
      # SET UP PYTHON
      # --------------------------------------------------

      - name: Set up Python

        if: steps.selection.outputs.run_segment == 'true'

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # --------------------------------------------------
      # CACHE PIP DEPENDENCIES
      # --------------------------------------------------

      - name: Cache Python dependencies

        if: steps.selection.outputs.run_segment == 'true'

        uses: actions/cache@v4

        with:

          path: ~/.cache/pip

          key: >-
            ${{ runner.os }}-python-3.12-
            ${{ hashFiles('requirements.txt') }}

          restore-keys: |
            ${{ runner.os }}-python-3.12-


      # --------------------------------------------------
      # INSTALL PROJECT DEPENDENCIES
      # --------------------------------------------------

      - name: Install dependencies

        if: steps.selection.outputs.run_segment == 'true'

        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------
      # INSTALL PLAYWRIGHT CHROMIUM
      # --------------------------------------------------

      - name: Install Playwright Chromium

        if: steps.selection.outputs.run_segment == 'true'

        run: |
          python -m playwright install --with-deps chromium


      # --------------------------------------------------
      # CREATE REQUIRED DIRECTORIES
      # --------------------------------------------------

      - name: Create workflow directories

        if: steps.selection.outputs.run_segment == 'true'

        run: |
          mkdir -p downloads/history
          mkdir -p downloads/_temporary
          mkdir -p workflow_debug


      # --------------------------------------------------
      # RUN SWING SCANNER
      # --------------------------------------------------

      - name: Run Swing Scanner

        if: steps.selection.outputs.run_segment == 'true'

        env:

          PYTHONUNBUFFERED: "1"

        run: |
          python scan_workflow_monitor.py \
            --segment "${{ matrix.segment }}"


      # --------------------------------------------------
      # UPLOAD EXCEL RESULTS
      # --------------------------------------------------

      - name: Upload Excel history workbook

        if: always() && steps.selection.outputs.run_segment == 'true'

        uses: actions/upload-artifact@v4

        with:

          name: >-
            swing-scanner-${{ matrix.segment }}-
            ${{ github.run_number }}

          path: |
            downloads/history/*.xlsx

          if-no-files-found: warn

          retention-days: 30


      # --------------------------------------------------
      # UPLOAD DEBUG FILES ONLY ON FAILURE
      # --------------------------------------------------

      - name: Upload debug artifacts

        if: failure() && steps.selection.outputs.run_segment == 'true'

        uses: actions/upload-artifact@v4

        with:

          name: >-
            workflow-debug-${{ matrix.segment }}-
            ${{ github.run_number }}

          path: |
            workflow_debug/**
            downloads/_temporary/**

          if-no-files-found: ignore

          retention-days: 14