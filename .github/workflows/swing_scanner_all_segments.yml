name: Swing Scanner - All Segments


on:

  workflow_dispatch:

    inputs:

      segment:

        description: "Select segment to scan"

        required: true

        default: "ALL"

        type: choice

        options:
          - ALL
          - LargeCap
          - MidCap
          - MidCap_all
          - SmallCap
          - SmallCap_all
          - MicroCap
          - Nifty500
          - AllNSE


  schedule:

    # --------------------------------------------------
    # DAILY AT 7:00 AM IST
    #
    # GitHub Actions cron uses UTC.
    #
    # 7:00 AM IST = 1:30 AM UTC.
    # --------------------------------------------------

    - cron: "30 1 * * *"


permissions:

  contents: write


concurrency:

  group: swing-scanner-workflow

  cancel-in-progress: false


jobs:

  # ==================================================
  # SCAN JOB
  # ==================================================

  scan:

    name: Scan - ${{ matrix.segment }}

    runs-on: ubuntu-latest

    timeout-minutes: 60


    strategy:

      fail-fast: false

      # ------------------------------------------------
      # IMPORTANT:
      #
      # Run one segment at a time because each segment
      # updates the same Excel history directory and
      # pushes changes to main.
      # ------------------------------------------------

      max-parallel: 1


      matrix:

        segment:
          - LargeCap
          - MidCap
          - MidCap_all
          - SmallCap
          - SmallCap_all
          - MicroCap
          - Nifty500
          - AllNSE


    steps:

      # ==================================================
      # CHECKOUT MAIN BRANCH
      # ==================================================

      - name: Checkout main branch

        uses: actions/checkout@v4

        with:

          ref: main

          fetch-depth: 0


      # ==================================================
      # CHECK WHETHER MATRIX SEGMENT SHOULD RUN
      # ==================================================

      - name: Check selected segment

        id: selection

        shell: bash

        run: |

          set -euo pipefail


          # ------------------------------------------------
          # SCHEDULED RUN
          #
          # Scheduled execution always runs all segments.
          # ------------------------------------------------

          if [ "${{ github.event_name }}" = "schedule" ]; then

            echo "run_segment=true" >> "$GITHUB_OUTPUT"

            echo "Scheduled execution detected."

            echo "Running segment: ${{ matrix.segment }}"

            exit 0

          fi


          # ------------------------------------------------
          # MANUAL RUN
          #
          # Run ALL or only the selected segment.
          # ------------------------------------------------

          SELECTED_SEGMENT="${{ inputs.segment }}"


          echo "Selected segment: ${SELECTED_SEGMENT}"

          echo "Matrix segment: ${{ matrix.segment }}"


          if [ "$SELECTED_SEGMENT" = "ALL" ] || \
             [ "$SELECTED_SEGMENT" = "${{ matrix.segment }}" ]; then

            echo "run_segment=true" >> "$GITHUB_OUTPUT"

            echo "Segment will run."

          else

            echo "run_segment=false" >> "$GITHUB_OUTPUT"

            echo "Segment will be skipped."

          fi


      # ==================================================
      # SET UP PYTHON
      # ==================================================

      - name: Set up Python

        if: steps.selection.outputs.run_segment == 'true'

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ==================================================
      # CACHE PYTHON DEPENDENCIES
      # ==================================================

      - name: Cache Python dependencies

        if: steps.selection.outputs.run_segment == 'true'

        uses: actions/cache@v4

        with:

          path: ~/.cache/pip

          key: >-
            ${{ runner.os }}-python-3.12-
            ${{ hashFiles('requirements.txt') }}

          restore-keys: |
            ${{ runner.os }}-python-3.12-


      # ==================================================
      # INSTALL PROJECT DEPENDENCIES
      # ==================================================

      - name: Install dependencies

        if: steps.selection.outputs.run_segment == 'true'

        shell: bash

        run: |

          set -euo pipefail


          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ==================================================
      # INSTALL PLAYWRIGHT CHROMIUM
      # ==================================================

      - name: Install Playwright Chromium

        if: steps.selection.outputs.run_segment == 'true'

        shell: bash

        run: |

          set -euo pipefail


          python -m playwright install --with-deps chromium


      # ==================================================
      # CREATE REQUIRED DIRECTORIES
      # ==================================================

      - name: Create workflow directories

        if: steps.selection.outputs.run_segment == 'true'

        shell: bash

        run: |

          set -euo pipefail


          mkdir -p downloads/history

          mkdir -p downloads/_temporary

          mkdir -p workflow_debug


      # ==================================================
      # RUN SWING SCANNER
      #
      # The Python workflow automatically sets the stock
      # limit to the maximum available for the selected
      # segment.
      #
      # No --limit argument is passed.
      # ==================================================

      - name: Run Swing Scanner

        if: steps.selection.outputs.run_segment == 'true'

        env:

          PYTHONUNBUFFERED: "1"

        shell: bash

        run: |

          set -euo pipefail


          echo "=========================================="

          echo "Starting Swing Scanner"

          echo "Segment: ${{ matrix.segment }}"

          echo "Stock limit: Maximum available"

          echo "=========================================="


          python scan_workflow_monitor.py \
            --segment "${{ matrix.segment }}"


      # ==================================================
      # VERIFY EXCEL RESULTS
      # ==================================================

      - name: Verify Excel history workbook

        if: success() && steps.selection.outputs.run_segment == 'true'

        shell: bash

        run: |

          set -euo pipefail


          echo "=========================================="

          echo "History workbooks created:"

          echo "=========================================="


          ls -lah downloads/history/


          WORKBOOK_COUNT="$(
            find downloads/history \
              -maxdepth 1 \
              -type f \
              -name '*.xlsx' \
              | wc -l
          )"


          echo ""

          echo "Workbook count: ${WORKBOOK_COUNT}"


          if [ "$WORKBOOK_COUNT" -eq 0 ]; then

            echo ""

            echo "ERROR: No Excel history workbook was created."

            exit 1

          fi


          echo ""

          echo "Excel history workbook verification passed."


      # ==================================================
      # DIAGNOSE GIT WORKTREE
      #
      # This helps identify unexpected changes produced
      # by the scanner before the Git commit.
      # ==================================================

      - name: Diagnose Git worktree

        if: success() && steps.selection.outputs.run_segment == 'true'

        shell: bash

        run: |

          set -euo pipefail


          echo "=========================================="

          echo "GIT WORKTREE DIAGNOSTICS"

          echo "=========================================="


          echo ""

          echo "Current branch:"

          git branch --show-current


          echo ""

          echo "Current commit:"

          git rev-parse HEAD


          echo ""

          echo "Remote main:"

          git ls-remote origin refs/heads/main


          echo ""

          echo "Git status:"

          git status --short


          echo ""

          echo "Modified tracked files:"

          git diff --name-only || true


          echo ""

          echo "Staged files:"

          git diff --cached --name-only || true


          echo ""

          echo "Untracked files:"

          git ls-files \
            --others \
            --exclude-standard || true


      # ==================================================
      # COMMIT SUCCESSFUL RESULTS TO MAIN
      # ==================================================

      - name: Commit Excel history to main

        if: success() && steps.selection.outputs.run_segment == 'true'

        shell: bash

        run: |

          set -euo pipefail


          echo "=========================================="

          echo "Preparing Git commit"

          echo "Segment: ${{ matrix.segment }}"

          echo "=========================================="


          # ------------------------------------------------
          # CONFIGURE GIT IDENTITY
          # ------------------------------------------------

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # ------------------------------------------------
          # SHOW WORKTREE BEFORE STAGING
          # ------------------------------------------------

          echo ""

          echo "Git status BEFORE staging:"

          git status --short


          # ------------------------------------------------
          # FETCH LATEST MAIN
          # ------------------------------------------------

          echo ""

          echo "Fetching latest main..."

          git fetch origin main


          # ------------------------------------------------
          # STAGE ONLY EXCEL HISTORY WORKBOOKS
          # ------------------------------------------------

          echo ""

          echo "Staging Excel history workbooks..."

          git add downloads/history/*.xlsx


          echo ""

          echo "Staged files:"

          git diff --cached --name-only


          # ------------------------------------------------
          # CHECK FOR CHANGES
          # ------------------------------------------------

          if git diff --cached --quiet; then

            echo ""

            echo "No Excel history changes to commit."

            exit 0

          fi


          # ------------------------------------------------
          # PROTECT UNSTAGED / UNTRACKED FILES
          #
          # The scanner may create temporary/debug files or
          # modify tracked files outside downloads/history.
          #
          # Keep the Excel files staged while stashing
          # everything else.
          # ------------------------------------------------

          echo ""

          echo "Protecting non-Excel working-tree changes..."


          if ! git diff --quiet || \
             [ -n "$(git ls-files --others --exclude-standard)" ]; then

            git stash push \
              --include-untracked \
              --keep-index \
              -m "scanner-workflow-${{ matrix.segment }}-${{ github.run_id }}"

          else

            echo "No non-staged changes detected."

          fi


          # ------------------------------------------------
          # COMMIT EXCEL HISTORY
          # ------------------------------------------------

          echo ""

          echo "Creating Excel history commit..."


          git commit \
            -m "chore(scanner): update ${{ matrix.segment }} history [skip ci]"


          # ------------------------------------------------
          # REBASE AGAINST LATEST MAIN
          # ------------------------------------------------

          echo ""

          echo "Rebasing against latest main..."


          git pull \
            --rebase \
            origin main


          # ------------------------------------------------
          # PUSH TO MAIN
          # ------------------------------------------------

          echo ""

          echo "Pushing Excel history to main..."


          git push origin HEAD:main


          echo ""

          echo "=========================================="

          echo "Git update completed successfully"

          echo "Segment: ${{ matrix.segment }}"

          echo "=========================================="


      # ==================================================
      # UPLOAD EXCEL RESULTS AS ARTIFACT
      #
      # always() ensures the generated workbook is
      # preserved even if the Git commit/push fails.
      # ==================================================

      - name: Upload Excel history workbook

        if: always() && steps.selection.outputs.run_segment == 'true'

        uses: actions/upload-artifact@v4

        with:

          name: >-
            swing-scanner-${{ matrix.segment }}-
            ${{ github.run_number }}

          path: |
            downloads/history/*.xlsx

          if-no-files-found: warn

          retention-days: 30


      # ==================================================
      # UPLOAD DEBUG FILES ONLY ON FAILURE
      # ==================================================

      - name: Upload debug artifacts

        if: failure() && steps.selection.outputs.run_segment == 'true'

        uses: actions/upload-artifact@v4

        with:

          name: >-
            workflow-debug-${{ matrix.segment }}-
            ${{ github.run_number }}

          path: |
            workflow_debug/**
            downloads/_temporary/**

          if-no-files-found: ignore

          retention-days: 14
